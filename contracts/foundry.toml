[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
qie_mainnet = "https://rpc1mainnet.qie.digital"
qie_testnet = "https://rpc1testnet.qie.digital"
